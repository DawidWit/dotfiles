add_newline = false
scan_timeout = 20
command_timeout = 500
palette = "deep_indigo"

format = "$directory$character"
right_format = "$git_branch$git_status$git_state$nodejs$python$rust$golang$java$cmd_duration$time"

[palettes.deep_indigo]
# generated by ~/.config/theme/apply.py -- do not edit by hand
background = "#1e2b57"
foreground = "#dde2f0"
primary = "#121a38"
accent = "#bcc9ff"
muted = "#8f99bd"
red = "#f2868f"
gold = "#f2d79a"
blue = "#a9c4ff"
purple = "#cbb2f5"
cyan = "#9adbe4"

[directory]
style = "bold accent"
truncation_length = 4
truncate_to_repo = false
read_only = " 󰌾"
read_only_style = "red"
format = "[$path]($style)[$read_only]($read_only_style) "

[character]
success_symbol = "[❯](bold accent)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold gold)"

[git_branch]
symbol = " "
style = "blue"
format = "[$symbol$branch]($style) "

[git_status]
style = "gold"
format = "([$all_status$ahead_behind]($style) )"

[git_state]
style = "purple"
format = "[$state( $progress_current/$progress_total)]($style) "

[nodejs]
symbol = " "
style = "accent"
format = "[$symbol($version)]($style) "

[python]
symbol = " "
style = "gold"
format = "[$symbol$pyenv_prefix($version)( \\($virtualenv\\))]($style) "

[rust]
symbol = " "
style = "red"
format = "[$symbol($version)]($style) "

[golang]
symbol = " "
style = "cyan"
format = "[$symbol($version)]($style) "

[java]
symbol = " "
style = "red"
format = "[$symbol($version)]($style) "

[cmd_duration]
min_time = 1500
show_milliseconds = false
style = "muted"
format = "[󰔛 $duration]($style) "

[time]
disabled = false
time_format = "%H:%M"
style = "muted"
format = "[$time]($style)"
