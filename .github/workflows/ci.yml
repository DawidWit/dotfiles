name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Linuxbrew
        if: runner.os == 'Linux'
        shell: bash
        run: |
          NONINTERACTIVE=1 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          echo "/home/linuxbrew/.linuxbrew/bin" >> "$GITHUB_PATH"

      - name: Install validation tools
        shell: bash
        run: |
          brew install chezmoi shellcheck shfmt stylua neovim tmux zsh

      - uses: pnpm/action-setup@v4
        with:
          version: 10.23.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Prepare Neovim smoke dependency
        shell: bash
        run: |
          mkdir -p "$HOME/.local/share/nvim/lazy"
          git clone --depth=1 https://github.com/folke/lazy.nvim.git "$HOME/.local/share/nvim/lazy/lazy.nvim"

      - name: Validate source
        shell: bash
        run: |
          pnpm install --frozen-lockfile
          pnpm rules:check
          bash tests/run
          shellcheck dot_local/bin/executable_*
          shfmt -d -i 2 dot_local/bin/executable_*
          stylua --check private_dot_config/nvim/lua
